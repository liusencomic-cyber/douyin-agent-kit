name: Feature Request
description: 提出一个新功能或改进建议
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        ## 功能建议
        请说明**要解决的问题**（而非直接给方案），便于讨论最合适的设计。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前缺失或不便之处是什么？影响哪些场景？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你设想的行为/接口/配置形态（可以是粗略想法）
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你尝试过的变通做法，或考虑过的其他设计
  - type: textarea
    id: scope
    attributes:
      label: 影响范围
      description: 是否涉及配置结构（config.schema.json / dy_config）、技能文档（SKILL.md）、或新增依赖
  - type: checkboxes
    id: willing
    attributes:
      label: 参与意愿
      options:
        - label: 我愿意提 PR 实现这个功能
        - label: 我只想讨论，不承诺实现
